server:
  port: 8082

spring:
  application:
    name: scheduling
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/guardia}
    username: ${DB_USER:scheduling_svc}
    password: ${DB_PASSWORD:scheduling_svc}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: scheduling
  flyway:
    # Namespaced per service: all three sets of migrations share one classpath in the
    # end-to-end suite, and a bare db/migration would make three V1 files collide.
    locations: classpath:db/migration/scheduling
    schemas: scheduling
    default-schema: scheduling
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: scheduling
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

management:
  endpoints:
    web:
      exposure:
        include: health,info
