name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      # Testcontainers starts Postgres and Kafka itself; the runner already has Docker.
      - run: ./mvnw -B --no-transfer-progress verify
