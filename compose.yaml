name: guardia

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: guardia
      POSTGRES_USER: guardia
      POSTGRES_PASSWORD: guardia
    # Not 5432 on the host: that port is usually already taken by another project's database,
    # and a service that silently connects to the wrong one is a bad afternoon. Inside this
    # network it is still plain 5432.
    ports: ["55432:5432"]
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardia -d guardia"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    # The same broker image the end-to-end suite runs against, so what passes in tests and
    # what runs here are not two different things.
    image: confluentinc/cp-kafka:7.8.0
    # Two listeners, because the broker has two kinds of client. A service in this network
    # reaches it as kafka:19092; anything on the host — a service started with mvnw, a console
    # consumer — reaches the same broker as localhost:9092. One advertised address cannot be
    # right for both, and getting it wrong produces a client that connects and then times out,
    # which is a confusing way to spend an afternoon.
    ports: ["9092:9092"]
    environment:
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,PLAINTEXT://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 20

  incidents:
    build: &service_build
      context: .
      args:
        MODULE: incidents
    environment: &service_env
      DB_URL: jdbc:postgresql://postgres:5432/guardia
      KAFKA_BOOTSTRAP: kafka:19092
      DB_USER: incidents_svc
      DB_PASSWORD: incidents_svc
    ports: ["8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck: &service_health
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  scheduling:
    build:
      <<: *service_build
      args:
        MODULE: scheduling
    environment:
      <<: *service_env
      DB_USER: scheduling_svc
      DB_PASSWORD: scheduling_svc
    ports: ["8082:8082"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      <<: *service_health
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health || exit 1"]

  sla:
    build:
      <<: *service_build
      args:
        MODULE: sla
    environment:
      <<: *service_env
      DB_USER: sla_svc
      DB_PASSWORD: sla_svc
    ports: ["8083:8083"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      <<: *service_health
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health || exit 1"]
